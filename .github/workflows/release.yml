name: Release

on:
  push:
    tags:
      - "v*"
  # Re-run against an existing tag: gh workflow run release.yml --ref v0.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Configure & Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Strip & verify portable imports
        shell: pwsh
        run: |
          $exe = "build\wada_clean.exe"

          $strip = (Get-Command strip.exe -ErrorAction SilentlyContinue).Source
          if (-not $strip) { $strip = "C:\mingw64\bin\strip.exe" }
          if (Test-Path $strip) { & $strip --strip-unneeded $exe }

          $objdump = (Get-Command objdump.exe -ErrorAction SilentlyContinue).Source
          if (-not $objdump) { $objdump = "C:\mingw64\bin\objdump.exe" }
          $imports = & $objdump -p $exe |
            Select-String 'DLL Name:\s*(.+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          Write-Host "imports: $($imports -join ', ')"

          # A shipped exe may only need DLLs present on a stock Windows install.
          # Any MinGW/MSYS runtime (libwinpthread, libgcc*, msys-*) must be static.
          $bad = $imports | Where-Object { $_ -match '^(lib|msys-)' }
          if ($bad) { throw "not portable, links non-system runtime: $($bad -join ', ')" }

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $dist = "dist"
          New-Item -ItemType Directory -Path "$dist\stage" -Force | Out-Null
          Copy-Item "build\wada_clean.exe" "$dist\stage\wada_clean.exe"
          Copy-Item "LICENSE" "$dist\stage\LICENSE"
          Copy-Item "README.md" "$dist\stage\README.md"
          $zip = "$dist\wada-clean-v$tag-win64.zip"
          Compress-Archive -Path "$dist\stage\*" -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  wada-clean-v$tag-win64.zip" | Set-Content -Path "$zip.sha256" -Encoding ASCII

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
